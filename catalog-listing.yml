# Description and details
demo_description: |
  **h2mi** migrates an on-prem Hadoop estate (HDFS + Hive Metastore, holding Hive tables and OSS Iceberg tables) into
  Databricks Unity Catalog **managed Iceberg**: a one-time historical load, then incremental sync per table until cutover.
  It runs on-prem as a PySpark application (`spark-submit` on YARN), talks to Databricks over outbound HTTPS only (Iceberg
  REST catalog + SQL Statement API), uploads data in one direction, and keeps its own append-only state.

  What's in the repo today: the requirements and technical design (lab-backed on the critical mechanics: IRC auth and
  long writes, sync modes for CoW/MoR/keyless sources, partition replace vs MERGE, tiered validation, the REPLACE TABLE
  hazard), process-flow diagrams, an implementation plan, and the Python package skeleton with its unit-tested core
  (config, type map, DDL generation, planner, validation primitives). The data-moving modules are the Phase-1 build.

  Use it when a customer asks how to move Hive / Iceberg tables off HDFS into UC managed Iceberg at PB scale with
  no inbound network path, exact validation, and a clean audit trail of who moved what.

