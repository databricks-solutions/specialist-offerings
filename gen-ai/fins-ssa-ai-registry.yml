# FINS SSA AI Team — Offering & FEIP Registry
# ---------------------------------------------
# Consumed by the `/refresh-offerings` skill (in databricks-ssa-ai-workflow plugin)
# to refresh the Confluence "Offerings and Projects" page (ID 6239453331's sibling,
# page 6237684017).
#
# This file is FINS-SSA-AI-team specific and intentionally lives ALONGSIDE — not inside —
# the per-offering `catalog-listing.yml` files. The global Field Catalog schema
# (catalog-listing.yml) is owned by the broader specialist-offerings program; this
# registry adds team-private state: FEIP cross-references and placeholder FEIPs
# that haven't been filed in Jira yet.
#
# How to edit:
#   - Adding a new offering: append to `offerings:`. Set `catalog_listing` once the
#     offering folder exists.
#   - Adding a FEIP that's already filed: replace its PLACEHOLDER:slug entry with
#     the real FEIP-NNNN key and delete the matching `feip_placeholders.slug` block.
#   - Adding a brand-new FEIP idea: add to `feip_placeholders` and reference as
#     PLACEHOLDER:slug under one or more offerings' `feips:` list. The same
#     PLACEHOLDER:slug can appear under multiple offerings (shared component).
#
# Refresh:  Run `/fins-ssa-ai-confluence:refresh-offerings` from Claude Code.

