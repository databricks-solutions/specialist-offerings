profiler_output:
  base_dir: "/path/to/profiler-output/Output"

# DuckDB input (alternative to profiler JSON files)
# If db_path is set, the analyzer reads from DuckDB tables instead of JSON
duckdb:
  db_path: ""  # e.g., "/path/to/hadoop_profiler.duckdb"

oozie:
  url: "http://oozie-host:11000"
  auth: "simple"
  kerberos_principal: ""
  max_jobs: 5000
  timeout: 30

webhdfs:
  enabled: false
  url: "http://namenode:9870"
  user: "hdfs"

output:
  format: "json"
  dir: "./analyzer-output"

complexity:
  enabled: false
  rules_dir: "./complexity_rules"
  local_code_dir: ""
