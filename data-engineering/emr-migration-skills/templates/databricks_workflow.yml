# Template: Databricks Workflow (DABs format)
# Converted from EMR Step/Job Flow
# Update values marked with <PLACEHOLDER> before deploying

resources:
  jobs:
    emr_migrated_job:
      name: "<JOB_NAME> (migrated from EMR)"
      description: "Migrated from EMR cluster <EMR_CLUSTER_ID>, step <EMR_STEP_ID>"

      # Schedule (converted from EMR/cron/Airflow schedule)
      schedule:
        quartz_cron_expression: "<CRON_EXPRESSION>"  # e.g., "0 0 8 * * ?"
        timezone_id: "America/Chicago"

      # Email notifications
      email_notifications:
        on_failure:
          - "<TEAM_EMAIL>"

      # Task definitions (converted from EMR steps)
      tasks:
        # Task 1: Main Spark job (converted from EMR Spark Step)
        - task_key: "main_spark_job"
          description: "Converted from EMR step: <EMR_STEP_NAME>"

          # Option A: Notebook task (for notebook-based workloads)
          notebook_task:
            notebook_path: "/Workspace/Users/${workspace.current_user.userName}/migrated/<NOTEBOOK_NAME>"
            base_parameters:
              input_path: "<S3_INPUT_PATH>"
              output_table: "<CATALOG.SCHEMA.TABLE>"
              run_date: "{{job.start_time.iso_date}}"

          # Option B: Spark Python task (for .py scripts)
          # spark_python_task:
          #   python_file: "/Workspace/Users/${workspace.current_user.userName}/migrated/<SCRIPT_NAME>.py"
          #   parameters:
          #     - "--input"
          #     - "<S3_INPUT_PATH>"
          #     - "--output"
          #     - "<CATALOG.SCHEMA.TABLE>"

          # Option C: Spark JAR task (for Scala/Java JARs)
          # spark_jar_task:
          #   main_class_name: "<MAIN_CLASS>"
          #   parameters:
          #     - "<ARG1>"
          #     - "<ARG2>"

          # Cluster configuration
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "<NODE_TYPE>"  # e.g., m5.xlarge
            num_workers: 2
            autoscale:
              min_workers: 1
              max_workers: 8
            spark_conf:
              # Carry over relevant Spark configs from EMR
              "spark.sql.adaptive.enabled": "true"
              "spark.sql.shuffle.partitions": "auto"
            # aws_attributes:
            #   availability: "SPOT_WITH_FALLBACK"
            #   spot_bid_price_percent: 100

          # Libraries (converted from EMR bootstrap/step JARs)
          libraries:
            - pypi:
                package: "<PACKAGE_NAME>"
            # - maven:
            #     coordinates: "<GROUP_ID>:<ARTIFACT_ID>:<VERSION>"

          # Retry policy
          max_retries: 1
          min_retry_interval_millis: 60000

        # Task 2: SQL validation (post-processing)
        - task_key: "validate_output"
          depends_on:
            - task_key: "main_spark_job"
          sql_task:
            query:
              query_string: |
                SELECT COUNT(*) as row_count
                FROM <CATALOG.SCHEMA.TABLE>
                WHERE processing_date = CURRENT_DATE()
            warehouse_id: "<SQL_WAREHOUSE_ID>"

      # Job clusters (alternative to per-task new_cluster)
      # job_clusters:
      #   - job_cluster_key: "shared_cluster"
      #     new_cluster:
      #       spark_version: "15.4.x-scala2.12"
      #       node_type_id: "m5.xlarge"
      #       autoscale:
      #         min_workers: 1
      #         max_workers: 8

      # Tags for tracking migration
      tags:
        migrated_from: "emr"
        emr_cluster_id: "<EMR_CLUSTER_ID>"
        migration_date: "<YYYY-MM-DD>"
