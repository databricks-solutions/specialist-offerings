# h2mi environment configuration (design §6). One file per environment; this is an EXAMPLE with placeholders.
# Secrets are REFERENCES (vault:<path>#<key> | aws-sm:<name>[#<json-key>] | env:<NAME>), never values (SEC-02).
env: prod
databricks:
  host: https://<workspace-host>
  warehouse_id: <warehouse-id>
  uc_catalog: <uc_catalog>
  region: <aws-region>
principals:
  ddl_admin: { client_id: "<ddl-admin-sp-application-id>", client_secret: "vault:secret/h2mi/ddl-admin#secret" }
  sync:                                     # one SP per domain (D6)
    payments: { client_id: "<payments-sync-sp-application-id>", client_secret: "vault:secret/h2mi/sync/payments#secret" }
    events:   { client_id: "<events-sync-sp-application-id>",   client_secret: "vault:secret/h2mi/sync/events#secret" }
source:
  hms_uri: thrift://<hms-host>:9083
  hive_metastore_version: "3.1.3"
state:
  hms_database: h2mi_ctl
  hdfs_root: hdfs://<nameservice>/apps/h2mi
  uc_mirror_schema: h2mi_ctl
naming:
  uc_schema: "{domain}"                     # HMS db.table -> <uc_catalog>.<uc_schema>.<uc_table>
  uc_table: "{hive_table}"
defaults:
  engine: onprem-push
  format_version: 3
  char_policy: preserve_padded
  ns_policy: hold
  validation_tier: standard
  batch_target_bytes: 274877906944          # 256 GiB per commit; also capped at throughput x 40 min (R11)  scan-secrets: allow
  late_data_lookback_partitions: 7
  retention_class: standard
  merge_executor: auto                      # auto | databricks | onprem (D11; auto = databricks unless under budget)
  onprem_merge_budget_bytes: 53687091200    # 50 GiB estimated download allowed for an on-prem MERGE
  l2_mode: scoped_async                     # tier M gates the watermark; scoped L2 runs asynchronously (VAL-12)
  l2_sample_partitions_per_cycle: 2
  replace_density_threshold: 0.25           # changed rows / rows in touched partitions at which partition replace wins
  small_partition_bytes: 1073741824         # below 1 GiB a partition replace beats a hash-diff regardless (INC-18)
retention_classes:
  standard:  { log_retention: "interval 30 days", deleted_file_retention: "interval 7 days" }
  financial: { log_retention: "interval 90 days", deleted_file_retention: "interval 30 days" }
