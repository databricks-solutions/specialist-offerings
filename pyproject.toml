[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2mi"
version = "0.1.0.dev0"
description = "HDFS / Hive Metastore (Hive + OSS Iceberg tables) -> Unity Catalog managed Iceberg migration utility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6",
  "databricks-sdk>=0.40",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4.2"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.6", "build>=1.2"]
all = ["h2mi[spark,aws,dev]"]

[project.scripts]
h2mi = "h2mi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"h2mi.scanner" = ["typemap.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
markers = ["integration: needs local Spark + Derby", "live: needs a UC sandbox"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
